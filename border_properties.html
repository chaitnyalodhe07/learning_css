<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
     /*solid,dotted,dashed,inset,outset*/
    .b_property1{
        border: 15px groove red;
    }
    .b_property2{
        border: 20px outset blueviolet;
    }
    .b_property3{
        border: 15px solid blue;
        border-top-color: green;
        border-right-color: blueviolet;
        border-bottom-color: green;
        border-left-color: blueviolet;
        border-radius: 50px 140px 20px 100px;
    }
</style>

</head>
<body>
    <img src="images/car1.avif" class="b_property1" />
    <img src="images/car2.jpg" class="b_property2" />
    <img src="images/car1.avif" class="b_property3"/>
</body>
</html>
