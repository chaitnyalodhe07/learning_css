<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .text-container{
            display: flex;
            justify-content: center;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 60px;
            font-weight: 900;
            letter-spacing: 4px;
            perspective: 20px;
        }
        .text-container > b {
            height: 70px;
            box-shadow: 0px 20px 5px gray;
            background: linear-gradient(to right,red,green, blue, yellow);
            background-clip: text;
            color:transparent;
            transform-origin: bottom;
            animation: getUpDown 10s infinite;
        }
        .text-container>b:nth-child(1){animation-delay: 0s;}
        .text-container>b:nth-child(2){animation-delay: 0.14s;}
        .text-container>b:nth-child(3){animation-delay: 0.28s;}
        .text-container>b:nth-child(4){animation-delay: 0.42s;}
        .text-container>b:nth-child(5){animation-delay: 0.56s;}
        .text-container>b:nth-child(6){animation-delay: 0.70s;}
        .text-container>b:nth-child(7){animation-delay: 0.84s;}
        .text-container>b:nth-child(8){animation-delay: 1s;}

        @keyframes getUpDown{
            from{transform: rotateX(-85deg);}
            10%,50%{transform: rotateX(0);}
            60%,to{transform: rotateX(-85deg);}
        }
    </style>
</head>
<body>
    <div class="text-container">
        <b>C</b><b>H</b><b>A</b><b>I</b><b>T</b><b>N</b><b>Y</b><b>A</b>

    </div>
</body>
</html>
